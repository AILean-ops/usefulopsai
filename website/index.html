<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UsefulOps AI</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="UsefulOps AI is currently archived." />
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5f6b7a;
        --paper: #f7f8fb;
        --line: #d9dee8;
        --blue: #1f4f8f;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--ink);
        background: var(--paper);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid var(--line);
        background: #fff;
      }

      p { margin: 0; }

      .eyebrow {
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 16px;
        font-size: clamp(2rem, 8vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .copy {
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
      }

      a {
        display: inline-flex;
        margin-top: 28px;
        color: var(--blue);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Archived project</p>
      <h1>UsefulOps AI</h1>
      <p class="copy">
        This project is no longer active. AI Lean Solutions is simplifying its public web
        presence and currently supports only the main company site.
      </p>
      <a href="https://aileansolutions.com/">Visit AI Lean Solutions</a>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UsefulOps AI</title>
    <meta name="description" content="Practical AI workflows for small business operations.">
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1f24;
        --muted: #58616d;
        --line: #d9dee5;
        --paper: #f7f8fa;
        --accent: #0f766e;
        --accent-dark: #115e59;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .shell {
        width: min(760px, 100%);
        border: 1px solid var(--line);
        background: #fff;
        padding: clamp(28px, 5vw, 56px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 15px;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 999px;
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-label="UsefulOps AI launch placeholder">
        <p class="eyebrow">UsefulOps AI</p>
        <h1>Practical AI workflows for small business operations.</h1>
        <p>
          UsefulOps AI helps owner-led teams turn repetitive admin work, follow-up friction,
          and reporting loops into useful AI-assisted workflows.
        </p>
        <div class="status">
          <span class="dot" aria-hidden="true"></span>
          <span>Site infrastructure test page. Full launch copy is being prepared.</span>
        </div>
      </section>
    </main>
  </body>
</html>

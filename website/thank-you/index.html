<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You | UsefulOps AI</title>
    <meta name="description" content="Thank you for purchasing from UsefulOps AI.">
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1f24;
        --muted: #58616d;
        --line: #d9dee5;
        --paper: #f7f8fa;
        --accent: #0f766e;
        --accent-dark: #115e59;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .shell {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        background: #fff;
        padding: clamp(28px, 5vw, 52px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent-dark);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 62px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        color: var(--accent-dark);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-label="UsefulOps AI thank you">
        <p class="eyebrow">UsefulOps AI</p>
        <h1>Thank you.</h1>
        <p>
          Your payment has been received. Rowan will review the order details and follow up
          from <a href="mailto:rowan.vale@usefulopsai.com">rowan.vale@usefulopsai.com</a>
          with the next step.
        </p>
      </section>
    </main>
  </body>
</html>
